<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tab Flash Jump Hints</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Tab jump labels</h1>
        <p>
          Titles stay clean by default. Use this popup for overflow/two-key
          labels.
        </p>
      </div>
      <output id="buffer" aria-live="polite"></output>
    </header>

    <main>
      <div id="status">Loading tabs…</div>
      <ol id="tabs" aria-label="Current window tabs"></ol>
    </main>

    <footer>
      <button id="refresh" type="button">Refresh labels</button>
      <span>Popup fallback: ⌘⇧J</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
